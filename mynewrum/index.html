<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🌺 Y2K Games</title>

  <!-- CORRIGIDO: O caminho correto para carregar o emulador via UNPKG -->
<script src="https://unpkg.com/@ruffle-rs/ruffle/ruffle.js"></script>

  <style>
    body {
      display: flex;
      justify-content: center; /* Centraliza o conteúdo horizontalmente */
      align-items: center;     /* Centraliza o conteúdo verticalmente */
      height: 100vh;
      margin: 0;
      background-color: #FFC7EA; /* Cor de fundo da página */
      overflow: hidden; /* Evita barras de rolagem na tela */
    }

    #game-container {
      /* Tamanho original (600x400) aumentado em 120% -> 720x480 */
      width: 720px;
      height: 480px;
      position: absolute; 
      top: 50%;            
      left: 50%;           
      transform: translate(-50%, -50%); /* Garante a centralização perfeita */
      border: 20px solid rgba(255, 165, 0, 0.7); /* Borda laranja com transparência */
      border-radius: 55px; /* Bordas arredondadas */
      background: rgba(255, 165, 0, 0.1); /* Fundo transparente com tom laranja */
      box-shadow: 0 0 55px 5px rgba(255, 165, 0, 0.8); /* Efeito neon laranja */
      backdrop-filter: blur(50px); /* Efeito de desfoque para imitar vidro */
    }

    /* Ajusta o emulador para preencher completamente o contêiner */
    #game-container ruffle-player {
      width: 100%;
      height: 100%;
    }

    h1 {
      position: absolute;
      top: 20px;
      text-align: center;
      width: 100%;
      color: #333;
      pointer-events: none; /* Impede que o título bloqueie cliques no jogo */
      z-index: 10; /* Mantém o título visível acima do jogo */
    }
  </style>
</head>
<body>

   <h1>🌺 Y2K Games</h1>

  <div id="game-container"></div>
  
  <script>
    // Configurações para forçar o jogo em Flash a esticar e alinhar os cliques
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
        "letterbox": "off",       /* Desliga barras pretas ou brancas ao redor */
        "scale": "exactFit",      /* Obriga o conteúdo do jogo a esticar até a borda */
        "forceScale": true,       /* Ignora travas de tamanho fixo do Flash original */
        "forceAlign": true,
        "quality": "high"
    };

    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      const container = document.getElementById("game-container");
      container.appendChild(player);

      player.load("mynewroom.swf");

      // Garante que o player use 100% da caixa de 720x480
      player.style.width = "100%";
      player.style.height = "100%";
    });
  </script>

</body>
</html>
