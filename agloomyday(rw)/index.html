<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>🌺 Y2K Games</title>

  <script src="https://unpkg.com"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFC7EA; /* Cor de fundo da página */
      overflow: hidden; /* Evita barras de rolagem causadas pelo zoom */
    }

    body {
      display: flex;
      justify-content: center; /* Centraliza o conteúdo horizontalmente */
      align-items: center;     /* Centraliza o conteúdo verticalmente */
      
      /* APLICA O ZOOM DE 120% NA TELA INTEIRA */
      zoom: 120%; /* Funciona perfeitamente no Chrome, Edge e Safari */
      transform: scale(1); /* Mantém a proporção correta */
    }

    #game-container {
      width: 600px;
      height: 400px;
      position: absolute; 
      top: 50%;            
      left: 50%;           
      transform: translate(-50%, -50%); /* Garante a centralização perfeita */
      border: 20px solid rgba(255, 165, 0, 0.7); /* Borda laranja com transparência */
      border-radius: 55px; /* Bordas arredondadas */
      background: rgba(255, 165, 0, 0.1); /* Fundo transparente com tom laranja */
      box-shadow: 0 0 55px 5px rgba(255, 165, 0, 0.8); /* Efeito neon laranja */
      backdrop-filter: blur(50px); /* Efeito de desfoque para imitar vidro */
    }

    /* Ajusta o jogo para preencher completamente o contêiner */
    #game-container > object {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Redimensiona o conteúdo sem cortar */
    }

    h1 {
      position: absolute;
      top: 20px;
      text-align: center;
      width: 100%;
      color: #333;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>🌺 Y2K Games</h1>
  </div>

  <script>
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      const container = document.getElementById("game-container");
      container.appendChild(player);

      player.load("Puanli_Giydirme_21.swf");

      // Ajuste para preencher completamente o contêiner sem cortar
      player.style.width = "100%";
      player.style.height = "100%";
      player.style.objectFit = "contain"; // Redimensiona o conteúdo sem cortar
    });
  </script>
</body>
</html>
